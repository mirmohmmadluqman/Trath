<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="320" viewBox="0 0 1024 320" role="img" aria-label="Trath wordmark transparent">
  <defs>
    <!-- Gradient and effects -->
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#29d9ff"/>
      <stop offset="48%" stop-color="#0096ff"/>
      <stop offset="100%" stop-color="#004fc8"/>
    </linearGradient>

    <linearGradient id="text-deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b67d8"/>
      <stop offset="100%" stop-color="#032f6f"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="0.7" y2="0.2">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="textOutline" x="-20%" y="-20%" width="140%" height="140%">
      <feMorphology operator="dilate" radius="0.4" in="SourceAlpha" result="dilated"/>
      <feGaussianBlur in="dilated" stdDeviation="0.4" result="blurOutline"/>
      <feColorMatrix in="blurOutline" type="matrix"
        values="0 0 0 0 0.02  0 0 0 0 0.12  0 0 0 0 0.3  0 0 0 0.10" result="outline"/>
      <feComposite in="outline" in2="SourceGraphic" operator="over"/>
    </filter>
  </defs>

  <!-- Shadow / depth layer -->
  <text x="50%" y="68%" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="800" font-size="180"
        letter-spacing="8"
        fill="url(#text-deep)"
        style="filter:url(#textOutline);">
    Trath
  </text>

  <!-- Main gradient face -->
  <text x="50%" y="66%" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="800" font-size="180"
        letter-spacing="8"
        fill="url(#text-grad)"
        style="filter:url(#textOutline);">
    Trath
  </text>

  <!-- Shine overlay -->
  <text x="50%" y="66%" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="800" font-size="180"
        letter-spacing="8"
        fill="url(#sheen)"
        opacity="0.9"
        style="mix-blend-mode:screen;">
    Trath
  </text>

  <!-- Thin white highlight -->
  <text x="50%" y="66%" text-anchor="middle"
        font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif"
        font-weight="800" font-size="180"
        letter-spacing="8"
        fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.4" paint-order="stroke">
    Trath
  </text>
</svg>
